<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TT Elite paper desk</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #030504; color: #a9bbb0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: #f0f7f2; margin: 0 0 8px; }
  h1 span { color: #22e07a; }
  a { color: #22e07a; }
</style>
</head>
<body>
<main>
  <h1>TT Elite <span>Paper Desk</span></h1>
  <p id="msg">Opening the dashboard…</p>
</main>
<script>
// This page holds no data and no key. It forwards to wherever the dashboard is being served right now
// (target.json, updated by the machine that runs it) and passes along the ?k= part of the link you were sent.
(async () => {
  const msg = document.getElementById('msg');
  const k = new URLSearchParams(location.search).get('k');
  if (!k) { msg.textContent = 'This dashboard is private. Open it with the full link you were sent.'; return; }
  try {
    const t = await (await fetch('target.json?t=' + Date.now(), {cache: 'no-store'})).json();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(t.url)) throw new Error('no address');
    location.replace(t.url + '/?k=' + encodeURIComponent(k));
  } catch (e) {
    msg.textContent = 'The dashboard is offline or restarting. Try again in a few minutes.';
  }
})();
</script>
</body>
</html>
